# Placeholder identifier: replace with a reverse-DNS id the project controls before a public release.
appId: org.openpdf.app
productName: OpenPDF
directories:
  output: dist
files:
  - out/**
  - package.json
# tesseract.js starts worker threads from files inside its own package, and the OCR language data is read from disk:
# neither works from inside the app archive.
# Updates come from this repository's releases. electron-builder writes app-update.yml from this into the program, and the
# updater uses it when no other update address is set (Settings > Updates and privacy). The repository is public, so no
# token is needed to read releases.
publish:
  provider: github
  owner: benmprojects
  repo: openpdf
  releaseType: release

asarUnpack:
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/**
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # No code signing is configured. Add a certificate (CSC_LINK / CSC_KEY_PASSWORD or
  # Azure Trusted Signing) before distributing, otherwise Windows SmartScreen will warn.
  signExecutable: false
  fileAssociations:
    - ext: pdf
      name: PDF document
      description: PDF document
      role: Editor
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
